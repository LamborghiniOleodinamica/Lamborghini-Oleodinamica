<script>

  // PASSO 1: la tela e il pennello
  const canvas = document.getElementById('globe');
   const ctx = canvas.getContext('2d');
 
   const N = 15000;
   const points = [];
   let angle = 0;
 
   const mask = new Image();
   mask.src = 'foto/world-mask.png';
 
   mask.onerror = () => console.log('ERRORE: immagine non trovata');
 
   // Tutto parte solo quando la mappa è caricata
   mask.onload = () => {
     console.log('mappa caricata:', mask.width, 'x', mask.height);
     // Mappa disegnata su una canvas invisibile per leggerne i pixel
     const off = document.createElement('canvas');
     off.width = mask.width;
     off.height = mask.height;
     const offCtx = off.getContext('2d');
     offCtx.drawImage(mask, 0, 0);
     const pixels = offCtx.getImageData(0, 0, off.width, off.height).data;
 
     for (let i = 0; i < N; i++) {
       // PASSO 2: altezza e raggio della "fetta"
       const y = 1 - (i / (N - 1)) * 2;
       const r = Math.sqrt(1 - y * y);
 
       // PASSO 3: posizione lungo il cerchio (angolo d'oro)
       const theta = i * Math.PI * (3 - Math.sqrt(5));
       const x = Math.cos(theta) * r;
       const z = Math.sin(theta) * r;
 
       // PASSO 4: da 3D a latitudine e longitudine
       const lat = Math.asin(y);
       const lon = Math.atan2(z, x);
 
       // PASSO 5: da lat/lon a pixel della mappa
       const px = Math.floor((lon + Math.PI) / (2 * Math.PI) * off.width);
       const py = Math.floor((0.5 - lat / Math.PI) * off.height);
 
       // PASSO 6: leggo il colore, se è chiaro è terra
       const index = (py * off.width + px) * 4;
       if (pixels[index] > 128) {
         points.push({ x, y, z });
       }
     }
     console.log('punti sulla terra:', points.length);
     draw();
   };
   
   function draw() {
     
     ctx.clearRect(0, 0, canvas.width, canvas.height);
     const R = canvas.width * 0.45;
     const cx = canvas.width / 2;
     const cy = canvas.height / 2;
     const cos = Math.cos(angle);
     const sin = Math.sin(angle);
 
     // corpo del globo: disco scuro semitrasparente che vela ciò che sta dietro
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);   // cerchio: centro, raggio, da 0 a 360°
    ctx.fill();

    ctx.fillStyle = '#fff';
 
     for (const p of points) {
       // PASSO 7: rotazione (y non cambia, come una giostra)
       const x = p.x * cos - p.z * sin;
       const z = p.x * sin + p.z * cos;
 
       // PASSO 8: salta i punti dietro, opacità in base alla profondità, disegna
       if (z < 0) continue;
       ctx.globalAlpha = z;
       ctx.fillRect(cx + x * R, cy - p.y * R, 1.5, 1.5);
     }
 
     angle += 0.003;
     requestAnimationFrame(draw);
   }
